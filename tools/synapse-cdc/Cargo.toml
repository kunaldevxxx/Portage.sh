[package]
name = "synapse-cdc"
version = "0.1.0"
edition = "2021"
authors = ["Aegis Platform Engineering <platform@aegis.internal>"]
description = "Air-gapped High-Throughput CDC & Merkle-Verifiable State Replicator"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
