apiVersion: v1
kind: Namespace
metadata:
  name: source-legacy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-postgres-0
  namespace: source-legacy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: gp2-legacy
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: source-legacy
  labels:
    app.kubernetes.io/name: postgres
    tier: database
spec:
  serviceName: postgres-svc
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data-postgres
  volumeClaimTemplates:
    - metadata:
        name: data-postgres
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: gp2-legacy
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: source-legacy
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgres
---
# Legacy Kubernetes Ingress (extensions/v1beta1)
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: postgres-ingress
  namespace: source-legacy
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  backend:
    serviceName: postgres-svc
    servicePort: 5432
  rules:
    - host: db.internal.enterprise.com
      http:
        paths:
          - path: /
            backend:
              serviceName: postgres-svc
              servicePort: 5432
