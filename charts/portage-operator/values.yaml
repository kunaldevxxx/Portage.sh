# Default values for portage-operator.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/kunaldevxxx/portage-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Image pull secrets for private registries (e.g., ghcr.io with enterprise backend)
# Example:
# imagePullSecrets:
#   - name: ghcr-enterprise-credentials
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Enterprise Backend Configuration (Private GHCR)
# Only required if using enterprise drivers (synapse-cdc, ghostwire)
enterpriseBackend:
  enabled: false
  # Private GHCR registry for enterprise components
  registry: ghcr.io/kunaldevxxx
  synapseCdc:
    repository: portage-enterprise-synapse-cdc
    tag: "1.0.0"
  ghostwire:
    repository: portage-enterprise-ghostwire
    tag: "1.0.0"
  # Credentials for pulling from private GHCR
  # Create with: kubectl create secret docker-registry ghcr-enterprise-credentials
  imagePullSecretName: ghcr-enterprise-credentials

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

crds:
  # Install CRDs with Helm
  install: true

leaderElection:
  enabled: true
  leaseDuration: 15s
  renewDeadline: 10s
  retryPeriod: 2s

metrics:
  enabled: true
  port: 8080

healthProbe:
  port: 8081

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Open-Core Pluggable Driver Defaults
drivers:
  defaultReplicationDriver: "community-cdc"
  defaultCutoverDriver: "community-cutover"
  enterpriseSynapseEndpoint: ""
  enterpriseGhostwireEndpoint: ""

# Sovereign / Air-Gapped Deployment
airgap:
  enabled: false
  customRegistry: ""
