name: "Clean Workflow Runs"

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  actions: write
  contents: read

jobs:
  purge-runs:
    name: "Purge All Past Workflow Runs"
    runs-on: ubuntu-latest
    steps:
      - name: "Delete All Past Workflow Runs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "==> Fetching all workflow runs for $REPO..."
          run_ids=$(gh run list --repo "$REPO" --limit 100 --json databaseId -q '.[].databaseId')

          if [ -z "$run_ids" ]; then
            echo "No workflow runs found to delete."
            exit 0
          fi

          count=0
          for id in $run_ids; do
            if [ "$id" != "$CURRENT_RUN_ID" ]; then
              echo "Deleting workflow run #$id..."
              gh run delete "$id" --repo "$REPO" || true
              count=$((count + 1))
            fi
          done
          echo "==> Successfully purged $count workflow runs!"
