name: "Clean Workflow Runs"

on:
  workflow_dispatch:
    inputs:
      save_period_days:
        description: "Number of days of runs to keep (0 = delete all runs older than today)"
        required: false
        default: "0"
      save_min_runs:
        description: "Minimum number of latest runs to keep per workflow"
        required: false
        default: "1"
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  actions: write
  contents: read

jobs:
  cleanup-runs:
    name: "Clean Historical Workflow Runs"
    runs-on: ubuntu-latest
    steps:
      - name: "Clean workflow runs"
        uses: dmvict/clean-workflow-runs@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          save_period: ${{ inputs.save_period_days || 0 }}
          save_min_runs_number: ${{ inputs.save_min_runs || 1 }}
          run_conclusions: |
            success
            failure
            cancelled
            timed_out
            skipped
