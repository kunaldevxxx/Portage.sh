name: Enterprise Credential Audit

# Run daily at 00:00 UTC
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ghcr-access:
    name: Audit GHCR Registry Access
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run GHCR compliance audit
        env:
          GITHUB_TOKEN: ${{ secrets.PORTAGE_ENTERPRISE_AUDIT_TOKEN }}
        run: |
          python3 scripts/audit_ghcr_compliance.py > audit-results.txt 2>&1
          cat audit-results.txt

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ghcr-audit-results
          path: audit-results.txt
          retention-days: 90

      - name: Check for security incidents
        if: always()
        run: |
          # Alert if high severity issues detected
          if grep -q "ALERT:" audit-results.txt; then
            echo "::warning::GHCR Security alerts detected - review audit results"
            exit 1
          fi

  credential-rotation-reminders:
    name: Send Credential Rotation Reminders
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for expiring credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          #!/bin/bash
          set -e

          # Query AWS Secrets Manager for expiring credentials (within 7 days)
          echo "Checking for expiring enterprise credentials..."

          EXPIRING=$(aws secretsmanager list-secrets \
            --filters Key=name,Values=portage/customer | \
            jq -r '.SecretList[] | select(.LastRotatedDate < now - 80 * 24 * 3600) | .Name' || true)

          if [[ -n "$EXPIRING" ]]; then
            echo "Found expiring credentials:"
            echo "$EXPIRING"

            # Store for next step
            echo "EXPIRING_CREDS=$EXPIRING" >> $GITHUB_ENV
          fi

      - name: Notify about expiring credentials
        if: env.EXPIRING_CREDS != ''
        uses: 8398a7/action-slack@v3
        with:
          status: warning
          text: |
            ⚠️ Portage Enterprise Credential Rotation Reminder

            The following customer GHCR credentials are expiring within 7 days:
            ${{ env.EXPIRING_CREDS }}

            Action required:
            1. Generate new PAT in GitHub
            2. Update AWS Secrets Manager
            3. Send renewal notification to customer

            Audit: https://github.com/kunaldevxxx/Portage.sh/actions
          webhook_url: ${{ secrets.SLACK_WEBHOOK_SECURITY }}
          fields: repo,message,ref,author

  export-audit-logs:
    name: Export GHCR Audit Logs to S3
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export GitHub audit logs to S3
        env:
          GITHUB_TOKEN: ${{ secrets.PORTAGE_ENTERPRISE_AUDIT_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: portage-github-audit-logs
        run: |
          #!/bin/bash
          set -e

          echo "Exporting GHCR audit logs to S3..."

          # Fetch last 24 hours of audit logs
          SINCE=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%SZ)

          curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/kunaldevxxx/audit-log?phrase=action:package.pull+created:>=$SINCE" \
            | jq '.' > audit-logs-$(date +%Y%m%d-%H%M%S).json

          # Upload to S3
          aws s3 cp audit-logs-*.json \
            s3://$S3_BUCKET/audit-logs/ \
            --sse AES256 \
            --storage-class GLACIER

          echo "✓ Audit logs exported to S3"

  slack-daily-summary:
    name: Post Daily Summary to Slack
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' &&
      github.event.schedule == '0 0 * * *'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate daily summary
        env:
          GITHUB_TOKEN: ${{ secrets.PORTAGE_ENTERPRISE_AUDIT_TOKEN }}
        run: |
          #!/bin/bash
          set -e

          echo "Generating daily GHCR access summary..."

          # Count pulls in last 24 hours
          SINCE=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%SZ)
          PULLS=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/kunaldevxxx/audit-log?phrase=action:package.pull+created:>=$SINCE" \
            | jq 'length')

          # Count failed attempts
          FAILED=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/kunaldevxxx/audit-log?phrase=action:package.pull+created:>=$SINCE+status:failed" \
            | jq 'length')

          cat > slack-message.txt <<EOF
          📊 Portage Enterprise GHCR Daily Summary
          ========================================

          Period: Last 24 hours

          📦 Container Pulls: $PULLS
          ❌ Failed Attempts: $FAILED
          ✅ Success Rate: $(echo "scale=1; (($PULLS - $FAILED) * 100) / $PULLS" | bc)%

          No security incidents detected.
          EOF

          cat slack-message.txt

      - name: Post to Slack
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_ENTERPRISE }}
          payload: |
            {
              "text": "📊 Portage Enterprise Daily Report",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📊 *Portage Enterprise GHCR Daily Summary*\n\n*Period:* Last 24 hours\n\n📦 *Container Pulls:* ${{ env.PULLS }}\n❌ *Failed Attempts:* ${{ env.FAILED }}\n✅ *Success Rate:* ${{ env.SUCCESS_RATE }}%"
                  }
                }
              ]
            }
