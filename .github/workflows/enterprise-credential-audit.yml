name: Enterprise Credential Audit

# Triggered manually on-demand only by the repository owner with an explicit token
on:
  workflow_dispatch:
    inputs:
      audit_token:
        description: 'GitHub Personal Access Token (PAT) with read:packages permissions'
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit-ghcr-access:
    name: Audit GHCR Registry Access
    runs-on: ubuntu-latest
    # Restrict execution strictly to repository owner
    if: github.repository_owner == 'kunaldevxxx' && github.actor == 'kunaldevxxx'

    steps:
      - name: Validate Token Input
        run: |
          if [ -z "${{ inputs.audit_token }}" ]; then
            echo "::error::An explicit Personal Access Token (audit_token) is required to run the enterprise audit."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run GHCR compliance audit
        env:
          GITHUB_TOKEN: ${{ inputs.audit_token }}
        run: |
          python3 scripts/audit_ghcr_compliance.py > audit-results.txt 2>&1
          cat audit-results.txt

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-audit-results
          path: audit-results.txt
          retention-days: 30

      - name: Check for security incidents
        if: always()
        run: |
          # Alert if high severity issues detected
          if grep -q "ALERT:" audit-results.txt; then
            echo "::warning::GHCR Security alerts detected - review audit results"
            exit 1
          fi

  credential-rotation-reminders:
    name: Send Credential Rotation Reminders
    runs-on: ubuntu-latest
    needs: audit-ghcr-access
    # Only run if repository owner triggered and AWS credentials are affirmatively configured
    if: |
      (github.repository_owner == 'kunaldevxxx' && github.actor == 'kunaldevxxx') &&
      secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for expiring credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          #!/bin/bash
          set -e

          echo "Checking AWS Secrets Manager for expiring credentials..."
          EXPIRING=$(aws secretsmanager list-secrets \
            --filters Key=name,Values=portage/customer | \
            jq -r '.SecretList[] | select(.LastRotatedDate < now - 80 * 24 * 3600) | .Name' || true)

          if [[ -n "$EXPIRING" ]]; then
            echo "Found expiring credentials:"
            echo "$EXPIRING"
            echo "EXPIRING_CREDS=$EXPIRING" >> $GITHUB_ENV
          fi

      - name: Notify about expiring credentials
        if: env.EXPIRING_CREDS != '' && secrets.SLACK_WEBHOOK_SECURITY != ''
        uses: 8398a7/action-slack@v3
        with:
          status: warning
          text: |
            ⚠️ Portage Enterprise Credential Rotation Reminder

            The following customer GHCR credentials are expiring within 7 days:
            ${{ env.EXPIRING_CREDS }}

            Action required:
            1. Generate new PAT in GitHub
            2. Update AWS Secrets Manager
            3. Send renewal notification to customer
          webhook_url: ${{ secrets.SLACK_WEBHOOK_SECURITY }}
          fields: repo,message,ref,author

  export-audit-logs:
    name: Export GHCR Audit Logs to S3
    runs-on: ubuntu-latest
    needs: audit-ghcr-access
    # Only run if AWS credentials and bucket are configured
    if: |
      (github.repository_owner == 'kunaldevxxx' && github.actor == 'kunaldevxxx') &&
      secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Export GitHub audit logs to S3
        env:
          GITHUB_TOKEN: ${{ inputs.audit_token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: portage-github-audit-logs
        run: |
          #!/bin/bash
          set -e

          echo "Exporting GHCR audit logs to S3..."
          SINCE=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)

          LOGS=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/kunaldevxxx/audit-log?phrase=action:package.pull+created:>=$SINCE" || echo "[]")

          echo "$LOGS" | jq '.' > audit-logs-$(date +%Y%m%d-%H%M%S).json

          aws s3 cp audit-logs-*.json \
            s3://$S3_BUCKET/audit-logs/ \
            --sse AES256 \
            --storage-class GLACIER || echo "Notice: S3 upload skipped or bucket not reachable"

          echo "✓ Audit log export step finished"

  slack-daily-summary:
    name: Post Daily Summary to Slack
    runs-on: ubuntu-latest
    needs: audit-ghcr-access
    # Only run if Slack webhook is configured
    if: |
      (github.repository_owner == 'kunaldevxxx' && github.actor == 'kunaldevxxx') &&
      secrets.SLACK_WEBHOOK_ENTERPRISE != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate summary report
        env:
          GITHUB_TOKEN: ${{ inputs.audit_token }}
        run: |
          #!/bin/bash
          set -e

          echo "Generating summary from GHCR audit..."
          echo "REPORT_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Post to Slack
        uses: slackapi/slack-github-action@v4
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_ENTERPRISE }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "📊 Portage Enterprise Audit Report",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📊 *Portage Enterprise GHCR Audit Run*\n\n*Date:* ${{ env.REPORT_DATE }}\n*Status:* Completed by repository owner."
                  }
                }
              ]
            }
