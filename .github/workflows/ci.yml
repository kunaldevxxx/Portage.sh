name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-ci:
    name: "Go Test & Lint (Portage.sh)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: "tools/portage/go.mod"

      - name: "Go Vet & Static Analysis"
        run: |
          cd tools/portage
          go vet ./...

      - name: "Run Go Tests with Race Detection"
        run: |
          cd tools/portage
          go test -race -coverprofile=coverage.out -covermode=atomic -v ./...

      - name: "Verify Build"
        run: |
          cd tools/portage
          go build -v ./...

      - name: "Upload Coverage Report"
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: tools/portage/coverage.out
          if-no-files-found: ignore

  rust-ci:
    name: "Rust Test & Lint (Synapse-CDC & Ghostwire)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: "Cargo Check"
        run: |
          cd portage-enterprise-backend
          cargo check --all-targets

      - name: "Run Rust Tests"
        run: |
          cd portage-enterprise-backend
          cargo test --all

  security-audit:
    name: "Security, Secrets & Vulnerability Audits"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Secret Leak Scanning (Gitleaks)"
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: "Setup Go for Govulncheck"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: "Run Govulncheck (Go Vulnerability Scanner)"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd tools/portage
          govulncheck ./...
        continue-on-error: true
